    nodes:
    - data:
        desc: 接收当前登录客服的 JWT（由 chat 服务每条消息填入）
        title: 开始
        type: start
        variables:
        - hide: true
          label: user_token
          max_length: 4096
          options: []
          required: true
          type: paragraph
          variable: user_token
      height: 90
      id: start
      position:
        x: 40
        y: 300
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 从用户本轮消息中提取单号、金额、筛选条件与独立检索问题
        instruction: |-
          只提取用户本轮消息中明确出现的内容，没有就留空（选择类型选 none），不得补全或猜测任何单号、金额或状态。
          历史消息仅用于帮助改写 standalone_question（把本轮问题改写成不依赖上下文的完整问题，供制度检索）；不要把历史消息里出现过的单号填进本轮参数字段。
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 4
        model:
          completion_params:
            temperature: 0.0
          mode: chat
          name: __ROUTER_MODEL__
          provider: __ROUTER_PROVIDER__
        parameters:
        - description: 用户本轮消息中明确提到的订单号，例如 A1023；没有则留空
          name: order_id
          required: false
          type: string
        - description: 用户本轮消息中明确提到的审批单号（AP 开头），例如 AP000001；没有则留空
          name: approval_id
          required: false
          type: string
        - description: 用户本轮消息中明确提到的退款单号（R 开头），例如 R000105；没有则留空
          name: refund_id
          required: false
          type: string
        - description: 用户本轮消息中明确提到的客户编号（C 开头），例如 C0003；没有则留空
          name: customer_id
          required: false
          type: string
        - description: 用户本轮消息中明确说出的退款金额（数字，单位元）；没有则留空
          name: amount
          required: false
          type: number
        - description: 用户口述的退货退款原因或补充说明，摘录原话；没有则留空
          name: reason_note
          required: false
          type: string
        - description: 要查询列表的目标类型：查订单列表选 orders，查退款记录选 refunds，否则选 none
          name: list_target
          options:
          - orders
          - refunds
          - none
          required: false
          type: select
        - description: 订单列表状态筛选；未指定选 none
          name: order_status
          options:
          - pending_payment
          - paid
          - shipped
          - delivered
          - completed
          - cancelled
          - none
          required: false
          type: select
        - description: 退款列表状态筛选；未指定选 none
          name: refund_status
          options:
          - processing
          - succeeded
          - failed
          - none
          required: false
          type: select
        - description: 是否只看有待处理售后工单的订单；未指定选 none
          name: open_ticket_only
          options:
          - 'yes'
          - 'no'
          - none
          required: false
          type: select
        - description: 把用户本轮问题改写成不依赖上下文的完整中文问题，供制度与手册检索
          name: standalone_question
          required: false
          type: string
        query:
        - sys
        - query
        reasoning_mode: function_call
        title: 参数提取
        type: parameter-extractor
        vision:
          enabled: false
      height: 110
      id: extract
      position:
        x: 340
        y: 300
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: __CODE:resolve_context.py__
        code_language: python3
        desc: 白名单校验、原文核对、订单号补全与只读查询计划
        outputs:
          amount:
            children: null
            type: number
          kb_query:
