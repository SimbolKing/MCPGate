app:
  description: 企业内部售后助手：查询负责区域内的订单、对照售后制度给出带出处的处理建议、提交退款申请（经主管审批后执行）并查询申请进度与记录。
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 售后助手
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables:
  - description: 本会话最近一次成功查到的订单号
    id: 10000000-0000-4000-8000-000000000001
    name: current_order_id
    selector:
    - conversation
    - current_order_id
    value: ''
    value_type: string
  - description: 本会话最近一次提交成功的审批单号
    id: 10000000-0000-4000-8000-000000000002
    name: last_approval_id
    selector:
    - conversation
    - last_approval_id
    value: ''
    value_type: string
  environment_variables:
  - description: Higress MCP 端点地址
    id: 20000000-0000-4000-8000-000000000001
    name: MCP_URL
    selector:
    - env
    - MCP_URL
    value: __MCP_URL__
    value_type: string
  features:
    file_upload:
      enabled: false
    opening_statement: 你好，我是售后助手，可帮你查询负责区域内的订单、对照售后制度给出处理建议、提交退款申请（经主管审批后执行）以及查询退款申请进度与记录。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: parameter-extractor
      id: start-source-extract-target
      source: start
      sourceHandle: source
      target: extract
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: parameter-extractor
        targetType: code
      id: extract-source-resolve-target
      source: extract
      sourceHandle: source
      target: resolve
      targetHandle: target
