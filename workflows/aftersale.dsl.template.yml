          - order_status
          variable: order_status
        - value_selector:
          - extract
          - refund_status
          variable: refund_status
        - value_selector:
          - extract
          - open_ticket_only
          variable: open_ticket_only
        - value_selector:
          - extract
          - standalone_question
          variable: standalone_question
        - value_selector:
          - conversation
          - current_order_id
          variable: current_order_id
        - value_selector:
          - conversation
          - last_approval_id
          variable: last_approval_id
      height: 110
      id: resolve
      position:
        x: 640
        y: 300
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        classes:
        - id: '1'
          name: 订单售后咨询
        - id: '2'
          name: 提交退款
        - id: '3'
          name: 进度与记录查询
        - id: '4'
          name: 制度与操作咨询
        - id: '5'
          name: 其他
        desc: 将用户本轮请求路由至五个确定分支之一
        instruction: |-
          只依据用户本轮消息判断意图，历史消息仅用于理解指代。
          规则：
          1. 订单售后咨询：针对某笔订单问情况、问能不能退、问怎么处理，例如“订单 A1023 的客户要退货，能退吗？”“查一下订单 B2087”。
          2. 提交退款：明确要求办理、提交、执行退款，例如“那帮他把款退了”“给 A1024 提交退款申请，退 100 元”。
          3. 进度与记录查询：询问退款申请是否通过、审批单或退款单状态，或按条件查订单列表、查退款记录，例如“那笔退款批了吗”“C0003 有哪些订单”“查一下退款记录”。
          4. 制度与操作咨询：不针对具体订单的售后制度、操作方法或故障排查问题，例如“生鲜能无理由退吗”“耳机一边没声音怎么排查”。
          5. 其他：与售后无关的闲聊或其他请求。
          注意：在“订单售后咨询”与“提交退款”之间拿不准时，一律选“订单售后咨询”；凡带疑问语气的（如“能退吗”“可以退 100 吗”）一律归为“订单售后咨询”。
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 4
        model:
          completion_params:
            temperature: 0.0
          mode: chat
          name: __ROUTER_MODEL__
          provider: __ROUTER_PROVIDER__
        query_variable_selector:
        - sys
        - query
        title: 意图分类
        type: question-classifier
        vision:
          enabled: false
      height: 160
      id: classify
      position:
        x: 940
        y: 300
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: not empty
            id: cond_has_order
            value: ''
            varType: string
            variable_selector:
            - resolve
            - order_id
          id: 'true'
          logical_operator: and
        desc: 检查是否已有可用订单号
        title: 是否有订单号
        type: if-else
      height: 120
      id: has_order
      position:
        x: 1260
        y: 120
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config:
            api_key: '{{#start.user_token#}}'
            type: bearer
          type: api-key
        body:
          data:
          - type: text
            value: '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"get_order","arguments":{"order_id":"{{#resolve.order_id#}}"}}}'
          type: json
        desc: 携带客服 JWT 经 Higress MCP 端点调用 get_order
        headers: Accept:application/json, text/event-stream
        method: post
        params: ''
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 100
        ssl_verify: true
        timeout:
          connect: 5
          read: 30
          write: 10
        title: 调用 get_order
        type: http-request
        url: '{{#env.MCP_URL#}}'
        variables: []
      height: 110
      id: call_get_order
      position:
        x: 1560
        y: 180
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: __CODE:parse_order.py__
        code_language: python3
        desc: 解析 get_order 结果，构造订单事实块、检索问题与事实预检
        outputs:
          call_summary:
            children: null
            type: object
          facts_text:
            children: null
            type: string
          ok:
            children: null
            type: number
          open_ticket_ids:
            children: null
            type: array[string]
          precheck_ok:
            children: null
            type: number
          precheck_reply:
            children: null
            type: string
          refundable_amount:
            children: null
            type: number
          reply:
            children: null
            type: string
          retrieval_query:
            children: null
            type: string
          ticket_amount:
            children: null
            type: number
        title: 解析订单与事实预检
        type: code
        variables:
        - value_selector:
          - call_get_order
          - status_code
          variable: status_code
        - value_selector:
          - call_get_order
          - body
          variable: body
