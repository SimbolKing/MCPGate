[project]
name = "mcpgate-workflows"
version = "1.0.0"
description = "MCPGate Dify Chatflow DSL 模板、代码节点与工具脚本"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["chat", "build", "dify/docker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code", "scripts"]
