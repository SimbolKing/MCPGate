id: D-04
title: 多轮上下文指代延续与切换订单（审计回填核对订单号）
layer: dialogue
category: overview
orders: [A1032, A1027]
steps:
  - id: t1
    do: chat
    as: wang
    query: 查一下订单 A1032。
    expect:
      should:
        trace: {mode: exact, calls: [{tool: get_order, kind: ok, order_id: A1032}]}
        contains_all: [羊毛大衣]

  - id: t2
    do: chat
    as: wang
    query: 这单能退吗？
    expect:
      should:
        trace: {mode: exact, calls: [{tool: get_order, kind: ok, order_id: A1032}]}
        verdict: refundable
        clauses: [{doc: 售后制度, clause: "6.1"}]

  - id: t3
    do: chat
    as: wang
    query: 那 A1027 呢？
    expect:
      should:
        trace: {mode: exact, calls: [{tool: get_order, kind: ok, order_id: A1027}]}
        verdict: not_refundable
        clauses: [{doc: 售后制度, clause: "4.2"}]
