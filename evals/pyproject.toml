[project]
name = "mcpgate-evals"
version = "1.0.0"
description = "MCPGate 评测套件与命令行评测工具（evals/harness）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "jmespath>=1.0",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["harness"]

[tool.coverage.report]
fail_under = 90
