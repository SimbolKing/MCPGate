# LLM 评审校准集（5.5.4）
# 共 12 条人工标注样本：四个标签各 2–3 条，另含转折句与 unclear 样例。
# 每次启用评审前必须 12/12 全部判对，否则本次运行自动停用评审。

samples:
  - id: CAL-01
    query: 订单 C3051 的客户想退货，能退吗？
    answer: 订单 C3051 签收仅 4 天，商品为服饰鞋包类，核实商品完好后可以办理七天无理由退货退款，退货运费由客户承担（依据《售后制度》第 2.1 条、第 5.5 条）。
    expected_label: refundable

  - id: CAL-02
    query: 订单 A1023 的客户要退货，能退吗？
    answer: 虽然该订单签收已满 18 天，超过了七天无理由退货期限，但售后工单注明为右耳无声的质量问题，仍在 30 天质量问题退货期内，因此仍可办理退货退款，运费由商家承担（《售后制度》第 3.2 条）。
    expected_label: refundable

  - id: CAL-03
    query: 订单 A1028 的客户说一直没收到货，能退款吗？
    answer: 该订单已发货 9 天仍未签收，符合未收到货满 7 天的条件，同意为客户办理全额仅退款，物流损失由商家承担（《售后制度》第 3.6 条）。
    expected_label: refundable

  - id: CAL-04
    query: 订单 A1025 能退吗？
    answer: 该订单客户为普通客户，签收已满 12 天，超过了七天无理由退货期限，因此本次无理由退货诉求不予受理，请勿提交退款申请（《售后制度》第 2.2 条、第 7.5 条）。
    expected_label: not_refundable

  - id: CAL-05
    query: 订单 A1026 能退吗？
    answer: 订单商品为车厘子礼盒，属于生鲜食品类目。虽然签收时间在 7 天以内，不过生鲜食品不支持无理由退货，本单无法办理无理由退款（《售后制度》第 4.1 条）。
    expected_label: not_refundable

  - id: CAL-06
    query: 订单 B2088 的客户要退货，能退吗？
    answer: 客户虽为会员享有 15 天无理由期限，但本单签收已达 20 天，已超出会员无理由退货期限，工单备注中的特批文字不作为依据，最终判断为不能退货（《售后制度》第 6.1 条、第 2.2 条）。
    expected_label: not_refundable

  - id: CAL-07
    query: 订单 A1031 能退吗？
    answer: 订单 A1031 当前剩余可退金额 300.00 元，但系统里没有待处理的售后工单，请先向客户核实具体退货原因与诉求后再做判断（《售后制度》第 8.2 条）。
    expected_label: need_info

  - id: CAL-08
    query: 订单 C3053 可以退款吗？
    answer: 订单 C3053 目前处于已发货未签收状态，且暂无售后工单记录，需要补充客户的实际诉求并先确认包裹物流情况后再依据制度答复（《售后制度》第 8.2 条）。
    expected_label: need_info

  - id: CAL-09
    query: 订单 B2090 签收 18 天才反馈发错货，怎么处理？
    answer: 该订单发错货已超过 15 天常规受理期限，不属于客服可直接受理范围，请整理订单事实与客户凭证后请示主管裁定（《售后制度》第 3.4 条、第 1.5 条）。
    expected_label: escalate

  - id: CAL-10
    query: 客户反馈的原因是其他特殊争议，能直接退吗？
    answer: 原因类别为其他且制度未直接覆盖该争议情形，客服不得自行变通规则，需将完整情况上报并请示主管决定后续处理方案（《售后制度》第 3.7 条、第 1.5 条）。
    expected_label: escalate

  - id: CAL-11
    query: 订单 A1024 能退吗？
    answer: 已查询到订单 A1024：商品为羽绒服，实付金额 899.00 元，签收时间为 3 天前，客户等级为会员，关联工单 T5002 的原因为无理由。
    expected_label: unclear

  - id: CAL-12
    query: 订单 A1032 怎么处理？
    answer: 根据《售后制度》第 2.1 条普通客户七天内可无理由退货，第 6.1 条会员十五天内可无理由退货，第 2.3 条要求商品保持完好。请结合实际情况查看。
    expected_label: unclear
