  - name: list_orders
    description: 查询订单列表 - 按客户、订单状态、是否有待处理售后工单筛选订单，按下单时间倒序分页返回订单摘要。结果只包含当前登录人负责区域内的订单，其他区域的订单不会出现在结果中。需要完整信息时再用订单号查询订单详情。
    args:
      - name: customer_id
        description: 客户编号，如 C0001
        type: string
        position: query
      - name: has_open_ticket
        description: true 只返回有待处理售后工单的订单，false 只返回没有的
