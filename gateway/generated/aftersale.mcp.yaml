server:
  name: aftersale
  securitySchemes:
    - id: BearerAuth
      type: http
      scheme: bearer
tools:
  - name: create_refund
    description: 发起退款【写操作】 - 【写操作】为指定订单创建退款单并立即执行退款，会增加订单的已退金额，不可撤销。只能对当前登录人负责区域内的订单操作。订单未支付或已取消、已有处理中的退款、金额超过可退金额时会被拒绝。本接口只校验订单数据，不判断是否符合售后制度。
    args:
      - name: amount
        description: 退款金额（元），须大于 0 且最多两位小数，不得超过订单可退金额
        type: number
        required: true
        position: body
      - name: idempotency_key
        description: 幂等键（可选，8–64 位字母数字下划线或连字符）；相同幂等键重复提交不会重复退款
        type: string
        position: body
      - name: order_id
        description: 订单号，如 A1023
        type: string
        required: true
        position: body
      - name: reason
        description: 退款说明，写明判断依据
        type: string
        required: true
        position: body
      - name: reason_category
        description: 退款原因类别
        type: string
        required: true
        enum:
          - quality_issue
          - no_reason
          - wrong_item
          - damaged_in_transit
          - not_received
          - other
        position: body
      - name: ticket_id
        description: 关联的售后工单号（可选）；提供后退款成功时该工单置为已处理
        type: string
        position: body
    requestTemplate:
      url: http://mock-api:8000/api/v1/refunds
      method: POST
      headers:
        - key: Content-Type
          value: application/json
      security:
        id: BearerAuth
    responseTemplate:
      prependBody: |+
        # API Response Information

        Below is the response from an API call. To help you understand the data, I've provided:

        1. A detailed description of all fields in the response structure
        2. The complete API response

        ## Response Structure

        > Content-Type: application/json

        - **amount**: 退款金额（元） (Type: number)
        - **completed_at**: 完成时间 (Type: string)
        - **created_at**: 创建时间 (Type: string)
        - **created_by**: 操作人的用户标识 (Type: string)
        - **created_by_role**: 操作人角色 (Type: string)
        - **order_id**: 所属订单号 (Type: string)
        - **reason**: 退款说明 (Type: string)
        - **reason_category**: 退款原因类别 (Type: string)
        - **refund_id**: 退款单号 (Type: string)
        - **region**: 所属区域 (Type: string)
        - **status**: 退款状态 (Type: string)
        - **ticket_id**: 关联的售后工单号 (Type: string)

        ## Original Response

    security:
      id: BearerAuth
      passthrough: true
    outputSchema:
      description: Successful Response
      properties:
        amount:
          description: 退款金额（元）
          type: number
        completed_at:
          description: 完成时间
          type: string
        created_at:
          description: 创建时间
          type: string
        created_by:
          description: 操作人的用户标识
          type: string
        created_by_role:
          description: 操作人角色
          type: string
        order_id:
          description: 所属订单号
          type: string
        reason:
          description: 退款说明
          type: string
        reason_category:
          description: 退款原因类别
          type: string
        refund_id:
          description: 退款单号
          type: string
        region:
          description: 所属区域
          type: string
        status:
          description: 退款状态
          type: string
        ticket_id:
          description: 关联的售后工单号
          type: string
      required:
        - refund_id
        - order_id
        - region
        - amount
        - reason_category
        - reason
        - status
        - created_by
        - created_by_role
        - created_at
      type: object
  - name: get_order
    description: 查询订单详情 - 按订单号查询一笔订单的完整信息：状态、金额、签收时间与已签收天数、商品及类目、客户等级、售后工单、已有退款。只返回事实数据，不判断是否符合售后制度。只能查询当前登录人负责区域内的订单；订单不在负责区域返回 403，订单号不存在返回 404。
    args:
      - name: order_id
        description: 订单号，如 A1023
        type: string
        required: true
        position: path
    requestTemplate:
      url: http://mock-api:8000/api/v1/orders/{order_id}
      method: GET
      security:
        id: BearerAuth
    responseTemplate:
      prependBody: |+
        # API Response Information

        Below is the response from an API call. To help you understand the data, I've provided:

        1. A detailed description of all fields in the response structure
        2. The complete API response

        ## Response Structure

        > Content-Type: application/json

        - **after_sale_tickets**: 售后工单列表 (Type: array)
          - **after_sale_tickets[].created_at**: 工单提交时间 (Type: string)
          - **after_sale_tickets[].description**: 客户描述 (Type: string)
          - **after_sale_tickets[].reason_category**: 售后申请原因类别 (Type: string)
          - **after_sale_tickets[].requested_amount**: 客户申请金额（元） (Type: number)
          - **after_sale_tickets[].resolved_at**: 工单处理完成时间 (Type: string)
          - **after_sale_tickets[].status**: 工单状态 (Type: string)
          - **after_sale_tickets[].ticket_id**: 售后工单号 (Type: string)
          - **after_sale_tickets[].type**: 售后申请类型 (Type: string)
        - **created_at**: 下单时间 (Type: string)
        - **customer**: 客户信息 (Type: object)
          - **customer.customer_id**: 客户编号 (Type: string)
          - **customer.level**: 客户等级（regular 普通 / vip 会员） (Type: string)
          - **customer.name**: 客户姓名 (Type: string)
          - **customer.phone_masked**: 脱敏手机号 (Type: string)
        - **days_since_delivery**: 已签收的自然日天数，签收当天为 0 (Type: integer)
        - **delivered_at**: 签收时间 (Type: string)
        - **items**: 商品明细 (Type: array)
          - **items[].category**: 商品类目 (Type: string)
          - **items[].product_name**: 商品名称 (Type: string)
          - **items[].quantity**: 商品数量 (Type: integer)
          - **items[].sku**: 商品编码 (Type: string)
          - **items[].unit_price**: 成交单价（元） (Type: number)
        - **order_id**: 订单号 (Type: string)
        - **paid_at**: 支付时间 (Type: string)
        - **refund_status**: 退款进度（none / partial / full） (Type: string)
        - **refundable_amount**: 当前还可退金额（元） (Type: number)
        - **refunded_amount**: 已成功退款累计金额（元） (Type: number)
        - **refunds**: 订单关联退款单列表 (Type: array)
          - **refunds[].amount**: 退款金额（元） (Type: number)
          - **refunds[].created_at**: 退款创建时间 (Type: string)
          - **refunds[].reason_category**: 退款原因类别 (Type: string)
          - **refunds[].refund_id**: 退款单号 (Type: string)
          - **refunds[].status**: 退款状态 (Type: string)
        - **region**: 订单所属区域 (Type: string)
        - **shipped_at**: 发货时间 (Type: string)
        - **status**: 订单状态 (Type: string)
        - **total_amount**: 订单实付金额（元） (Type: number)

        ## Original Response

    security:
      id: BearerAuth
      passthrough: true
    outputSchema:
      description: Successful Response
      properties:
        after_sale_tickets:
          description: 售后工单列表
          items:
            properties:
              created_at:
                description: 工单提交时间
                type: string
