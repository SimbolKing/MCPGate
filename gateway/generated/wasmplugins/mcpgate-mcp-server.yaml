      - name: get_refund
        description: 查询退款单详情 - 按退款单号查询一张退款单的金额、原因、状态和操作人。只能查询当前登录人负责区域内的退款单；不在负责区域返回 403，退款单号不存在返回 404。
        args:
        - name: refund_id
          description: 退款单号，如 R000105
          type: string
