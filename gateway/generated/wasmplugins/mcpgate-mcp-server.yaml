      - name: get_order
        description: 查询订单详情 - 按订单号查询一笔订单的完整信息：状态、金额、签收时间与已签收天数、商品及类目、客户等级、售后工单、已有退款。只返回事实数据，不判断是否符合售后制度。只能查询当前登录人负责区域内的订单；订单不在负责区域返回 403，订单号不存在返回 404。
        args:
        - name: order_id
          description: 订单号，如 A1023
          type: string
          required: true
          position: path
        requestTemplate:
          url: http://mock-api:8000/api/v1/orders/{order_id}
          method: GET
          security:
            id: BearerAuth
        responseTemplate:
          prependBody: |+
            # API Response Information

            Below is the response from an API call. To help you understand the data, I've provided:

            1. A detailed description of all fields in the response structure
            2. The complete API response

            ## Response Structure

            > Content-Type: application/json

            - **after_sale_tickets**: 售后工单列表 (Type: array)
              - **after_sale_tickets[].created_at**: 工单提交时间 (Type: string)
              - **after_sale_tickets[].description**: 客户描述 (Type: string)
              - **after_sale_tickets[].reason_category**: 售后申请原因类别 (Type: string)
              - **after_sale_tickets[].requested_amount**: 客户申请金额（元） (Type: number)
              - **after_sale_tickets[].resolved_at**: 工单处理完成时间 (Type: string)
              - **after_sale_tickets[].status**: 工单状态 (Type: string)
              - **after_sale_tickets[].ticket_id**: 售后工单号 (Type: string)
              - **after_sale_tickets[].type**: 售后申请类型 (Type: string)
            - **created_at**: 下单时间 (Type: string)
            - **customer**: 客户信息 (Type: object)
              - **customer.customer_id**: 客户编号 (Type: string)
              - **customer.level**: 客户等级（regular 普通 / vip 会员） (Type: string)
              - **customer.name**: 客户姓名 (Type: string)
              - **customer.phone_masked**: 脱敏手机号 (Type: string)
            - **days_since_delivery**: 已签收的自然日天数，签收当天为 0 (Type: integer)
            - **delivered_at**: 签收时间 (Type: string)
            - **items**: 商品明细 (Type: array)
              - **items[].category**: 商品类目 (Type: string)
              - **items[].product_name**: 商品名称 (Type: string)
              - **items[].quantity**: 商品数量 (Type: integer)
              - **items[].sku**: 商品编码 (Type: string)
              - **items[].unit_price**: 成交单价（元） (Type: number)
            - **order_id**: 订单号 (Type: string)
            - **paid_at**: 支付时间 (Type: string)
            - **refund_status**: 退款进度（none / partial / full） (Type: string)
            - **refundable_amount**: 当前还可退金额（元） (Type: number)
            - **refunded_amount**: 已成功退款累计金额（元） (Type: number)
            - **refunds**: 订单关联退款单列表 (Type: array)
              - **refunds[].amount**: 退款金额（元） (Type: number)
              - **refunds[].created_at**: 退款创建时间 (Type: string)
              - **refunds[].reason_category**: 退款原因类别 (Type: string)
              - **refunds[].refund_id**: 退款单号 (Type: string)
              - **refunds[].status**: 退款状态 (Type: string)
            - **region**: 订单所属区域 (Type: string)
            - **shipped_at**: 发货时间 (Type: string)
            - **status**: 订单状态 (Type: string)
            - **total_amount**: 订单实付金额（元） (Type: number)

            ## Original Response

        security:
          id: BearerAuth
          passthrough: true
        outputSchema:
          description: Successful Response
          properties:
